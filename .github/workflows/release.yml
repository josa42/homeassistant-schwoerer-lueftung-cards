name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # HACS prefers a release asset over the file in the branch, so the tag
      # is what users actually install.
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: schwoerer-lueftung-cards.js
          generate_release_notes: true
          draft: false
          prerelease: false
